<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="netscli architecture overview: one binary providing CLI, TUI and MCP server, plus a separate desktop app, all over one shared core library">
  <defs>
    <style>
      .bg     { fill: #0b0d0e; }
      .box    { fill: none; stroke: #3a3f46; stroke-width: 1.5; }
      .group  { fill: none; stroke: #3a3f46; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .core   { fill: none; stroke: #0aae7a; stroke-width: 2; }
      .link   { stroke: #3a3f46; stroke-width: 1.25; fill: none; }

      .title  { fill: #d7dbe1; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .sub    { fill: #6a6f78; font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .note   { fill: #6a6f78; font: italic 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .grouplabel { fill: #8b919b; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: 0.06em; }
      .core-title { fill: #c8cdd6; font: 700 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .core-sub   { fill: #6a6f78; font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <!-- Three of the four surfaces are ONE binary, and the old version of this
       diagram did not say so: it drew CLI/TUI, desktop and MCP as three peer
       boxes, which reads as three things to install. The docs lead with the
       opposite: `netscli` with a command is the CLI, with none it opens the
       TUI, and `netscli serve` is the MCP server. The dashed group is that
       fact; the desktop app sits outside it because it genuinely is a
       separate download. -->

  <!-- one binary, three surfaces -->
  <rect class="group" x="60" y="48" width="500" height="150" rx="10"/>
  <text class="grouplabel" x="80" y="72">ONE BINARY — apps/netscli-cli</text>

  <rect class="box" x="82" y="90" width="146" height="86" rx="8"/>
  <text class="title" x="155" y="124" text-anchor="middle">CLI</text>
  <text class="sub"   x="155" y="146" text-anchor="middle">netscli scan</text>
  <text class="sub"   x="155" y="164" text-anchor="middle">netscli discover</text>

  <rect class="box" x="238" y="90" width="146" height="86" rx="8"/>
  <text class="title" x="311" y="124" text-anchor="middle">Terminal UI</text>
  <text class="sub"   x="311" y="146" text-anchor="middle">netscli</text>
  <text class="sub"   x="311" y="164" text-anchor="middle">(no subcommand)</text>

  <rect class="box" x="394" y="90" width="146" height="86" rx="8"/>
  <text class="title" x="467" y="124" text-anchor="middle">MCP server</text>
  <text class="sub"   x="467" y="146" text-anchor="middle">netscli serve</text>
  <text class="sub"   x="467" y="164" text-anchor="middle">crates/netscli-mcp</text>

  <!-- separate download -->
  <rect class="box" x="640" y="90" width="220" height="86" rx="8"/>
  <text class="title" x="750" y="124" text-anchor="middle">Desktop app</text>
  <text class="sub"   x="750" y="146" text-anchor="middle">apps/netscli-gui  (Tauri)</text>
  <text class="sub"   x="750" y="164" text-anchor="middle">separate download</text>

  <!-- center hub -->
  <rect class="core" x="260" y="268" width="440" height="110" rx="10"/>
  <text class="core-title" x="480" y="304" text-anchor="middle">netscli-core</text>
  <text class="core-sub"   x="480" y="326" text-anchor="middle">discover · scan · ping · dns · arp · pcap</text>
  <text class="core-sub"   x="480" y="346" text-anchor="middle">inspect · sweep · stats · db · oui</text>
  <text class="note"       x="480" y="367" text-anchor="middle">one async library, shared by every surface above</text>

  <!-- arrows from surfaces down to core -->
  <path class="link" d="M310 198 L 420 266"/>
  <path class="link" d="M750 176 L 560 266"/>

  <!-- bottom row: what the core talks to -->
  <text class="sub" x="70"  y="443">Network</text>
  <line x1="70"  y1="453" x2="300" y2="453" stroke="#3a3f46" stroke-width="1"/>
  <text class="sub" x="70"  y="473" style="fill:#c8cdd6">raw ICMPv4, TCP connect</text>
  <text class="sub" x="70"  y="493" style="fill:#c8cdd6">hickory-resolver</text>
  <text class="sub" x="70"  y="513" style="fill:#c8cdd6">libpcap / Npcap (optional)</text>

  <text class="sub" x="340" y="443">Per-OS adapters</text>
  <line x1="340" y1="453" x2="620" y2="453" stroke="#3a3f46" stroke-width="1"/>
  <text class="sub" x="340" y="473" style="fill:#c8cdd6">Linux — /proc/net/arp, iproute2</text>
  <text class="sub" x="340" y="493" style="fill:#c8cdd6">macOS — arp -an, pnet_datalink</text>
  <text class="sub" x="340" y="513" style="fill:#c8cdd6">Windows — ipconfig, arp -a</text>

  <text class="sub" x="660" y="443">On-disk state</text>
  <line x1="660" y1="453" x2="890" y2="453" stroke="#3a3f46" stroke-width="1"/>
  <text class="sub" x="660" y="473" style="fill:#c8cdd6">~/.netscli/netscli.db</text>
  <text class="sub" x="660" y="493" style="fill:#c8cdd6">~/.netscli/tui-settings.json</text>
  <text class="sub" x="660" y="513" style="fill:#c8cdd6">oui.min.json.gz (embedded)</text>

  <!-- arrows from core down to its three dep groups -->
  <path class="link" d="M360 383 L 200 428"/>
  <path class="link" d="M480 383 L 480 428"/>
  <path class="link" d="M600 383 L 760 428"/>

  <text class="note" x="480" y="570" text-anchor="middle">
    The whole library is pure Rust and async. Each surface wires its own I/O on top.
  </text>
</svg>
