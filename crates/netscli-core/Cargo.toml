[package]
name = "netscli-core"
version = "0.1.1"
description = "Core networking library: discovery, scanning, DNS, ARP, PCAP, and OUI resolution"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# The OUI vendor DB ships with the crate so vendor lookups work
# out of the box on `cargo install`. ~400 KB gzipped.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "data/oui.min.json.gz",
    "Cargo.toml",
    "README.md",
]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
ipnet.workspace = true
pnet_packet = "0.34"
pnet_transport = "0.34"
ipnetwork = "0.20"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
sysinfo = "0.30"
pcap = { version = "1.1", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
mac_address = { version = "1.1", features = ["serde"] }
futures = "0.3"
once_cell = "1.19"
flate2 = "1.0"

[target.'cfg(unix)'.dependencies]
pnet_sys = "0.34"
pnet_datalink = "0.34"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock"] }

[features]
default = []
pcap = ["dep:pcap"]

[dev-dependencies]
tempfile = "3.8"
