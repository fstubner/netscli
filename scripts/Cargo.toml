[package]
name = "generate-oui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-oui"
path = "generate-oui.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "charset"] }
serde_json = "1.0"
flate2 = "1.1"

