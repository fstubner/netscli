[package]
# The source directory stays `apps/netscli-cli/` for internal workspace
# consistency, but the published crate is just `netscli` so users can
# `cargo install netscli` (matching the produced binary name).
name = "netscli"
version = "0.2.4"
description = "Interactive TUI and CLI for network discovery, scanning, and diagnostics"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
ipnet.workspace = true
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.4"
clap_mangen = "0.2"
ratatui = "0.29.0"
crossterm = "0.28"
tui-textarea = "0.4"
netscli-core = { path = "../../crates/netscli-core", version = "0.2.4", default-features = false, features = ["db", "mdns"] }
netscli-mcp = { path = "../../crates/netscli-mcp", version = "0.2.4", features = ["mdns"] }
serde_yaml_ng = "0.10"
dirs = "6.0"
mac_address = "1.1.8"
shell-words = "1.1"
dialoguer = "0.11"
unicode-width = "0.2"

[features]
default = []
pcap = ["netscli-core/pcap", "netscli-mcp/pcap"]

[[bin]]
name = "netscli"
path = "src/main.rs"
