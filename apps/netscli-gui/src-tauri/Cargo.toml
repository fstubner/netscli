[package]
name = "netscli-gui"
version = "0.2.6"
description = "Tauri 2.0 desktop GUI for network discovery, scanning, and diagnostics"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
# Open the constraint to the full 2.x line so cargo resolves to whatever
# tauri minor matches the npm `@tauri-apps/api` (currently 2.10). The CLI
# rejects same-major-different-minor skew with "Found version mismatched
# Tauri packages", which broke the v0.2.2 GUI release.
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ipnet.workspace = true
dirs = "6.0"
netscli-core = { path = "../../../crates/netscli-core", default-features = false }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
default = ["mdns"]
custom-protocol = ["tauri/custom-protocol"]
mdns = ["netscli-core/mdns"]
pcap = ["netscli-core/pcap"]
