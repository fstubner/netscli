name = "xtctx-cloud"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain routing for xtctx.com
routes = [
  { pattern = "mcp.xtctx.com", custom_domain = true },
  { pattern = "sync.xtctx.com", custom_domain = true }
]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "xtctx-db"
database_id = "f64a7fc9-60a3-41be-964f-efbca6897f88"

[vars]
# Public GitHub OAuth App Client ID (for Device Flow)
GITHUB_CLIENT_ID = "Ov23liFUTodqfoH9mgHA"
ENVIRONMENT = "production"

# Secrets to set via `wrangler secret put <NAME>`:
# - JWT_SECRET: Secret key for signing user tokens
# - GITHUB_CLIENT_SECRET: (Optional) If using Web Application flow instead of Device Flow
