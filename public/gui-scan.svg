<svg xmlns="http://www.w3.org/2000/svg" width="1375" height="1000" viewBox="0 0 1375 1000" role="img" aria-label="NetsCLI desktop scan screenshot with sanitized demo host data">
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#005a1e"/>
      <stop offset=".48" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#1edcff"/>
    </linearGradient>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:"Cascadia Mono","SF Mono",Consolas,monospace}
      .bg{fill:#242932}
      .panel{fill:#2d323d}
      .bar{fill:#20242c}
      .dark{fill:#181b21}
      .line{stroke:#3a414d;stroke-width:1}
      .soft{fill:#8793a8}
      .text{fill:#d7dce5}
      .muted{fill:#9aa7bd}
      .accent{fill:#2ee7c0}
      .ok{fill:#2ee7a8}
      .warn{fill:#ffbd3a}
      .danger{fill:#ff5570}
      .cmd{fill:#f5f7fb;font-weight:700}
      .head{fill:#b7c8df}
    </style>
  </defs>

  <rect width="1375" height="1000" rx="8" fill="#14171d"/>
  <rect x="0" y="0" width="1375" height="1000" rx="8" class="bg"/>

  <g class="ui">
    <rect x="0" y="0" width="1375" height="44" class="bar"/>
    <text x="24" y="30" fill="url(#brand)" font-size="18" font-weight="800">N</text>
    <text x="55" y="28" class="text" font-size="14">File</text>
    <text x="102" y="28" class="text" font-size="14">Edit</text>
    <text x="152" y="28" class="text" font-size="14">Scan</text>
    <text x="212" y="28" class="text" font-size="14">Tools</text>
    <text x="278" y="28" class="text" font-size="14">History</text>
    <text x="364" y="28" class="text" font-size="14">Settings</text>
    <text x="455" y="28" class="text" font-size="14">Help</text>
    <text x="1224" y="28" class="soft" font-size="16">-</text>
    <rect x="1284" y="15" width="10" height="10" rx="1" fill="none" stroke="#9aa7bd" stroke-width="1.4"/>
    <text x="1342" y="29" class="soft" font-size="20">×</text>
  </g>

  <g class="ui">
    <rect x="0" y="44" width="1375" height="58" class="panel"/>
    <polygon points="34,65 34,82 48,73.5" fill="none" stroke="#2ee7c0" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="78" class="accent" font-size="14">Start Scan</text>
    <rect x="155" y="67" width="12" height="12" rx="1" fill="none" stroke="#6f7c91"/>
    <line x1="200" y1="60" x2="200" y2="88" class="line"/>
    <path d="M230 64v18m-7-7 7 7 7-7" fill="none" stroke="#8fa0b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M274 63h13v18h-13zM278 68h5M278 73h5" fill="none" stroke="#8fa0b8" stroke-width="1.5"/>
    <rect x="912" y="50" width="414" height="40" rx="5" fill="#1a1d24" stroke="#39404c"/>
    <path d="M932 62h17l-7 8v8l-4 2v-10z" fill="none" stroke="#8793a8" stroke-width="1.5"/>
    <text x="962" y="75" class="soft" font-size="14">filter results: status:open port:&lt;number&gt;</text>
    <rect x="1326" y="50" width="44" height="40" rx="0" fill="#1a1d24" stroke="#39404c"/>
    <path d="M1342 66l6 6 6-6" fill="none" stroke="#9aa7bd" stroke-width="1.5"/>
  </g>

  <g class="ui">
    <rect x="0" y="102" width="1375" height="52" class="bar"/>
    <rect x="0" y="102" width="230" height="52" fill="#2b303a"/>
    <rect x="0" y="102" width="230" height="3" fill="url(#brand)"/>
    <circle cx="24" cy="128" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
    <line x1="29" y1="133" x2="34" y2="138" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="44" y="133" class="text" font-size="15" font-weight="700">Scan</text>
    <text x="89" y="133" class="soft" font-size="14">demo.local - 8080</text>
    <text x="202" y="133" class="soft" font-size="17">×</text>
    <rect x="230" y="102" width="86" height="52" fill="#242932" stroke="#333a46"/>
    <text x="257" y="135" class="soft" font-size="24">+</text>
    <path d="M286 124l5 5 5-5" fill="none" stroke="#8793a8" stroke-width="1.3"/>
  </g>

  <g class="ui">
    <rect x="0" y="154" width="1375" height="64" class="panel"/>
    <text x="18" y="191" class="head" font-size="15">Host</text>
    <rect x="72" y="158" width="612" height="38" rx="4" fill="#1b1e25" stroke="#3d4654"/>
    <text x="90" y="183" class="cmd mono" font-size="15">demo.local</text>
    <text x="704" y="191" class="head" font-size="15">Ports</text>
    <rect x="748" y="158" width="610" height="38" rx="4" fill="#1b1e25" stroke="#3d4654"/>
    <text x="766" y="183" class="cmd mono" font-size="15">8080</text>
  </g>

  <g class="ui">
    <rect x="0" y="218" width="1375" height="70" class="panel"/>
    <text x="18" y="250" class="head" font-size="14">Port ^</text>
    <text x="150" y="250" class="head" font-size="14">Proto</text>
    <text x="310" y="250" class="head" font-size="14">Service</text>
    <text x="530" y="250" class="head" font-size="14">Status</text>
    <text x="744" y="250" class="head" font-size="14">Latency</text>
    <text x="982" y="250" class="head" font-size="14">Banner</text>
    <rect x="4" y="252" width="1367" height="36" fill="#214640" stroke="#2ee7c0"/>
    <text x="18" y="276" class="cmd mono" font-size="15">8080</text>
    <text x="150" y="276" class="cmd mono" font-size="15">tcp</text>
    <text x="310" y="276" class="cmd mono" font-size="15">http-alt</text>
    <circle cx="532" cy="270" r="4" class="ok"/>
    <text x="548" y="276" class="text" font-size="15">open</text>
    <text x="744" y="276" class="cmd mono" font-size="15">2 ms</text>
    <text x="982" y="276" class="cmd mono" font-size="15">netscli-demo</text>
  </g>

  <rect x="0" y="288" width="1375" height="428" fill="#242932"/>

  <g class="ui">
    <rect x="0" y="716" width="1375" height="44" class="panel"/>
    <text x="18" y="746" class="text" font-size="14">banner</text>
    <text x="103" y="746" class="head" font-size="14">headers</text>
    <text x="196" y="746" class="head" font-size="14">tls</text>
    <text x="248" y="746" class="text" font-size="14" font-weight="700">raw</text>
    <rect x="228" y="755" width="60" height="3" fill="#2ee7c0"/>
    <text x="698" y="746" class="soft mono" font-size="13">port 8080 - http-alt</text>
    <rect x="1310" y="731" width="11" height="11" rx="1" fill="none" stroke="#9aa7bd"/>
    <path d="M1342 733l6 6 6-6" fill="none" stroke="#9aa7bd" stroke-width="1.5"/>
  </g>

  <g class="mono" font-size="15">
    <rect x="0" y="760" width="1375" height="168" fill="#2d323d"/>
    <text x="18" y="792" fill="#7dd3fc">{</text>
    <text x="38" y="816"><tspan fill="#38bdf8">"banner"</tspan><tspan fill="#d7dce5">: </tspan><tspan fill="#2ee7a8">"netscli-demo"</tspan><tspan fill="#d7dce5">,</tspan></text>
    <text x="38" y="840"><tspan fill="#38bdf8">"http"</tspan><tspan fill="#d7dce5">: {</tspan></text>
    <text x="58" y="864"><tspan fill="#38bdf8">"headers"</tspan><tspan fill="#d7dce5">: [</tspan></text>
    <text x="78" y="888"><tspan fill="#d7dce5">{ </tspan><tspan fill="#38bdf8">"name"</tspan><tspan fill="#d7dce5">: </tspan><tspan fill="#2ee7a8">"Connection"</tspan><tspan fill="#d7dce5">, </tspan><tspan fill="#38bdf8">"value"</tspan><tspan fill="#d7dce5">: </tspan><tspan fill="#2ee7a8">"close"</tspan><tspan fill="#d7dce5"> }</tspan></text>
    <text x="58" y="912" fill="#d7dce5">]</text>
    <text x="38" y="936" fill="#d7dce5">}</text>
  </g>

  <g class="mono" font-size="15">
    <rect x="0" y="928" width="1375" height="42" class="dark"/>
    <text x="18" y="955" fill="#2ee7c0">&gt;_</text>
    <text x="52" y="955" class="cmd">netscli scan demo.local -p 8080 --json</text>
    <rect x="1347" y="944" width="10" height="10" rx="1" fill="none" stroke="#2ee7c0"/>
  </g>

  <g class="ui">
    <rect x="0" y="970" width="1375" height="30" class="panel"/>
    <circle cx="20" cy="985" r="5" class="ok"/>
    <text x="38" y="990" class="text" font-size="13">Interface up</text>
    <line x1="126" y1="976" x2="126" y2="994" class="line"/>
    <text x="142" y="990" class="head" font-size="13">Lab Adapter</text>
    <line x1="820" y1="976" x2="820" y2="994" class="line"/>
    <text x="840" y="990" class="soft" font-size="13">↓ 0.00 ↑ 0.00 Mbps</text>
    <text x="1264" y="990" class="soft" font-size="13">1 results - 1 open</text>
  </g>
</svg>
