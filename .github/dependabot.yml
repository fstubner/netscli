# Dependabot config. Groups updates so the PR flood is manageable, and
# tones down the noise from transitive advisories that can't be fixed
# without upstream moving.

version: 2
updates:
  # Rust workspace at repo root (crates/ + apps/netscli-cli).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      # Patch bumps rarely need individual review — batch them.
      rust-patch:
        update-types:
          - patch
      # Minor bumps for non-critical deps go together too.
      rust-minor:
        update-types:
          - minor
        exclude-patterns:
          - tauri*
          - sqlx*
          - tokio
          - hickory-*
      # Anything in the first-tier surface stays as its own PR so
      # breaking changes get individual attention.
      tauri:
        patterns:
          - tauri*
      sqlx:
        patterns:
          - sqlx*
      tokio:
        patterns:
          - tokio
      hickory:
        patterns:
          - hickory-*

  # netscli-gui frontend (React/Vite/TS).
  - package-ecosystem: npm
    directory: "/apps/netscli-gui"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      # Bundler stack (vite + rollup + their transitive friends) moves
      # often; batch the boring stuff.
      vite-rollup:
        patterns:
          - vite
          - "@vitejs/*"
          - rollup
          - "*rollup*"
      react:
        patterns:
          - react
          - react-*
          - "@types/react*"
      tauri-js:
        patterns:
          - "@tauri-apps/*"

  # The Astro site has its own package.json and lockfile and was getting no
  # updates at all -- the repo-wide security PRs that land on it are GitHub's
  # separate alert flow, not this file. It builds and ships netscli.com, so
  # its toolchain matters.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
          - "@astrojs/starlight"

  # The MCP smoke test drives `netscli serve` with the official MCP SDK
  # client, so it is a pinned npm project of its own. Its SDK version is the
  # thing worth keeping current: the test exists because clients built on
  # that SDK are the ones that dropped our replies.
  - package-ecosystem: npm
    directory: "/scripts/mcp-smoke"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
      - scripts
    groups:
      mcp-smoke:
        patterns:
          - "*"

  # packaging/npm/netscli/package.json is deliberately absent. It is a
  # template: its version and its five optionalDependencies are @@VERSION@@
  # placeholders that publish-npm.sh fills in, and the packages it names are
  # this project's own, published by the same job.

  # scripts/ has its own Cargo project.
  - package-ecosystem: cargo
    directory: "/scripts"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
      - scripts
    groups:
      scripts-deps:
        update-types:
          - patch
          - minor

  # scripts/linux-check.Dockerfile, the local Linux check image. Its only
  # dependency is the rust base image, which is pinned to the toolchain in
  # rust-toolchain.toml, so a PR here means a new Rust release is out. Bump
  # rust-toolchain.toml, Cargo.toml's rust-version and the workflows'
  # `toolchain:` inputs in the same change, or close it.
  - package-ecosystem: docker
    directory: "/scripts"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - scripts

  # GitHub Actions workflow pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # dtolnay/rust-toolchain's numeric refs are Rust toolchain versions
    # (1.96.0, not the action's release). Every workflow now pins it by
    # commit SHA with an explicit `toolchain` input, so Dependabot has
    # nothing to bump here, but keep this ignore as a belt-and-braces
    # guard against it reading the `# stable` marker as a version.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns:
          - "*"
