version: 2

updates:
  # Actions are pinned to full commit SHAs, which is the right supply-chain
  # control but means nothing ever moves them off an unpatched version.
  # Dependabot rewrites the SHA and keeps the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # The Worker: wrangler, workers-types and the OAuth provider move often, and
  # the provider is security-relevant.
  - package-ecosystem: npm
    directory: /cloud
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
