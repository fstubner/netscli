name: Release

on:
  release:
    # `published` fires when a draft transitions to public. `created` only
    # fires on initial draft creation, which happens via release-drafter
    # (a GITHUB_TOKEN-driven action) so wouldn't trigger us anyway.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload assets for (e.g. v0.1.0)'
        required: true
        type: string

# Keyed on the tag, not the ref: `workflow_dispatch` and `release: published`
# reach the same tag by different refs, and two runs uploading assets for one
# tag race each other on `softprops/action-gh-release`.
#
# `cancel-in-progress: false` deliberately, unlike ci.yml/site.yml. A cancelled
# matrix leg leaves the release with some assets uploaded and some missing,
# and publish.yml is meanwhile polling for exactly the assets that will now
# never arrive. Queueing a duplicate run is harmless — it rebuilds and
# re-uploads the same files.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Both jobs below set `timeout-minutes`; GitHub's default is 360. A stalled
  # `apt-get` once held CI jobs at that default for six hours (see ci.yml),
  # and these run the same system-dependency installs.
  #
  # A timeout here is safe to recover from: the job uploads assets to an
  # existing release, so a missed asset is re-uploaded by re-running the job.
  # Downstream, publish.yml's `wait_for_asset` fails with a clear message
  # rather than publishing a manifest for something that is not there.
  #
  # Sized against measured runs: the slowest observed job is the Windows GUI
  # installer at ~7 minutes, so 60 leaves ample room for a cold cache,
  # cross-compilation and bundling while still bounding a genuine hang.
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      # id-token: write is required for sigstore keyless signing. Cosign
      # exchanges the OIDC token issued by GitHub Actions for a short-lived
      # certificate from Fulcio bound to this workflow + commit + tag. No
      # long-lived secrets to manage.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-x86_64
            build_flags: ""
            pcap: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-x86_64-pcap
            build_flags: --features pcap
            pcap: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: netscli
            asset_name: netscli-linux-x86_64-musl
            build_flags: ""
            pcap: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-aarch64
            build_flags: ""
            pcap: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-aarch64-pcap
            build_flags: --features pcap
            pcap: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: netscli.exe
            asset_name: netscli-windows-x86_64.exe
            build_flags: ""
            pcap: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: netscli.exe
            asset_name: netscli-windows-x86_64-pcap.exe
            build_flags: --features pcap
            pcap: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-x86_64
            build_flags: ""
            pcap: false
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-x86_64-pcap
            build_flags: --features pcap
            pcap: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-aarch64
            build_flags: ""
            pcap: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-aarch64-pcap
            build_flags: --features pcap
            pcap: true
    steps:
      # On workflow_dispatch we need the tag ref explicitly. On release
      # events the default ref is already the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Install libpcap (Linux, pcap)
        if: runner.os == 'Linux' && matrix.pcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev pkg-config

      - name: Install musl toolchain (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Npcap SDK (Windows, pcap)
        if: runner.os == 'Windows' && matrix.pcap
        shell: pwsh
        run: |
          $sdkUrl = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          # Pinned digest for npcap-sdk-1.13.zip (364,431 bytes). npcap.com
          # is a third-party host outside our control, and whatever this
          # step unpacks gets linked into a binary we then cosign-sign — so
          # the signature would attest to a build that trusted an
          # unverified download. Verify before extracting.
          # Re-pin deliberately when bumping the SDK version.
          $sdkSha256 = "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd"
          $zipPath = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $destPath = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          if ($actual -ne $sdkSha256) {
            Write-Error "Npcap SDK checksum mismatch. Expected $sdkSha256, got $actual"
            exit 1
          }
          Write-Host "Npcap SDK checksum verified."
          Expand-Archive -Path $zipPath -DestinationPath $destPath -Force
          # The 1.13 zip has Lib/ and Include/ at the archive root, no
          # wrapping npcap-sdk/ folder. Point LIB/INCLUDE at $destPath
          # directly.
          $libPath = Join-Path $destPath "Lib\x64"
          $includePath = Join-Path $destPath "Include"
          "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$includePath;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build CLI
        run: cargo build --locked --release -p netscli --target ${{ matrix.target }} ${{ matrix.build_flags }}

      - name: Prepare release asset (rename)
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Generate SHA256 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
        working-directory: target/${{ matrix.target }}/release

      - name: Generate SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "target/${{ matrix.target }}/release/${{ matrix.asset_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${asset}.sha256" -Encoding ascii

      # Sigstore keyless signing via the GitHub Actions OIDC token. Produces
      # a .sig and .pem alongside each binary; verifiable by anyone with:
      #   cosign verify-blob --signature <asset>.sig --certificate <asset>.pem \
      #     --certificate-identity-regexp 'https://github.com/fstubner/netscli/.github/workflows/release\.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     <asset>
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release asset (sigstore keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd target/${{ matrix.target }}/release
          cosign sign-blob --yes \
            --output-signature "${{ matrix.asset_name }}.sig" \
            --output-certificate "${{ matrix.asset_name }}.pem" \
            "${{ matrix.asset_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sha256
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sig
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.pem
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Desktop GUI installers ───────────────────────────────────────────
  # Builds the Tauri 2 desktop app on each native runner. .msi/.dmg/.deb/
  # .AppImage outputs from `tauri.conf.json:bundle.targets = "all"` get
  # renamed to `netscli-gui-{os}-{arch}.{ext}`, sigstore-signed, and
  # uploaded alongside the CLI binaries on the same release.
  #
  # GUI installers intentionally do not pass `--features pcap`: packet capture
  # requires libpcap/Npcap at runtime, and NetsCLI does not redistribute Npcap
  # inside the Windows desktop installer.
  #
  # macOS .dmg ships UNSIGNED — users see "unverified developer" on first
  # launch and must right-click → Open. Notarization (paid Apple Developer
  # cert) is tracked separately. Linux ARM64 + Windows ARM64 GUI builds
  # are out of matrix scope for v0.2.1 to keep CI budget reasonable.
  gui:
    name: Build GUI installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_prefix: netscli-gui-linux-x86_64
            bundle_dir: bundle
            bundle_globs: "deb/*.deb appimage/*.AppImage"
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_prefix: netscli-gui-macos-aarch64
            bundle_dir: bundle
            bundle_globs: "dmg/*.dmg"
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_prefix: netscli-gui-macos-x86_64
            bundle_dir: bundle
            bundle_globs: "dmg/*.dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_prefix: netscli-gui-windows-x86_64
            bundle_dir: bundle
            bundle_globs: "msi/*.msi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/netscli-gui/package-lock.json

      # Tauri 2 needs the same GTK/WebKit stack the lint job already
      # installs in ci.yml. Mirror it here so the bundle step can link.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: npm ci
        run: npm ci
        working-directory: apps/netscli-gui

      # The trailing `-- --locked` is forwarded by the Tauri CLI to cargo, so
      # the Rust half of the installer gets the same lockfile enforcement the
      # CLI job above already has. Without it a signed .msi/.dmg could be
      # built against resolved-at-CI-time dependency versions that no
      # committed Cargo.lock ever pinned. `npm ci` covers the frontend half.
      - name: tauri build
        run: npm run tauri -- build --target ${{ matrix.target }} -- --locked
        working-directory: apps/netscli-gui

      # Tauri puts bundles under apps/netscli-gui/src-tauri/target/<TARGET>/
      # release/bundle/{deb,appimage,dmg,msi}/. Rename each artifact to a
      # predictable name then sigstore-sign it.
      - name: Collect, rename, and sign GUI artifacts
        shell: bash
        env:
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
          BUNDLE_GLOBS: ${{ matrix.bundle_globs }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Cargo workspaces use the workspace-root `target/` regardless
          # of the cwd cargo was invoked from. Tauri puts its bundles in
          # target/<TARGET>/release/bundle/{deb,appimage,dmg,msi}/.
          BUNDLE_ROOT="target/${TARGET}/release/bundle"
          OUT_DIR="${RUNNER_TEMP}/gui-out"
          mkdir -p "${OUT_DIR}"
          # Walk each glob, copy with the canonical asset name preserving
          # the file extension. Tauri produces e.g. NetsCLI_0.2.1_amd64.deb;
          # we want netscli-gui-linux-x86_64.deb.
          for glob in ${BUNDLE_GLOBS}; do
            for src in ${BUNDLE_ROOT}/${glob}; do
              [ -e "${src}" ] || continue
              ext="${src##*.}"
              dst="${OUT_DIR}/${ASSET_PREFIX}.${ext}"
              cp "${src}" "${dst}"
              echo "Collected ${src} -> ${dst}"
            done
          done
          ls -la "${OUT_DIR}"

      - name: Generate SHA256
        shell: bash
        env:
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/gui-out"
          cd "${OUT_DIR}"
          for f in ${ASSET_PREFIX}.*; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "${f}.sha256"
            else
              shasum -a 256 "$f" > "${f}.sha256"
            fi
          done
          ls -la

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign GUI artifacts (sigstore keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/gui-out"
          cd "${OUT_DIR}"
          for f in ${ASSET_PREFIX}.*; do
            # Skip the sha256 + any pre-existing sig/pem on re-runs.
            case "$f" in
              *.sha256|*.sig|*.pem) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            ${{ runner.temp }}/gui-out/${{ matrix.asset_prefix }}.*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
