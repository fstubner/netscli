name: Release

on:
  release:
    # `published` fires when a draft transitions to public. `created` only
    # fires on initial draft creation, which happens via release-drafter
    # (a GITHUB_TOKEN-driven action) so wouldn't trigger us anyway.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload assets for (e.g. v0.1.0)'
        required: true
        type: string

# Keyed on the tag, not the ref: `workflow_dispatch` and `release: published`
# reach the same tag by different refs, and two runs uploading assets for one
# tag race each other on `softprops/action-gh-release`.
#
# `cancel-in-progress: false` deliberately, unlike ci.yml/site.yml. A cancelled
# matrix leg leaves the release with some assets uploaded and some missing,
# and publish.yml is meanwhile polling for exactly the assets that will now
# never arrive. Queueing a duplicate run is harmless — it rebuilds and
# re-uploads the same files.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Both jobs below set `timeout-minutes`; GitHub's default is 360. A stalled
  # `apt-get` once held CI jobs at that default for six hours (see ci.yml),
  # and these run the same system-dependency installs.
  #
  # A timeout here is safe to recover from: the job uploads assets to an
  # existing release, so a missed asset is re-uploaded by re-running the job.
  # Downstream, publish.yml's `wait_for_asset` fails with a clear message
  # rather than publishing a manifest for something that is not there.
  #
  # Sized against measured runs: the slowest observed job is the Windows GUI
  # installer at ~7 minutes, so 60 leaves ample room for a cold cache,
  # cross-compilation and bundling while still bounding a genuine hang.
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      # id-token: write is required for sigstore keyless signing. Cosign
      # exchanges the OIDC token issued by GitHub Actions for a short-lived
      # certificate from Fulcio bound to this workflow + commit + tag. No
      # long-lived secrets to manage.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-x86_64
            build_flags: ""
            pcap: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-x86_64-pcap
            build_flags: --features pcap
            pcap: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: netscli
            asset_name: netscli-linux-x86_64-musl
            build_flags: ""
            pcap: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-aarch64
            build_flags: ""
            pcap: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: netscli
            asset_name: netscli-linux-aarch64-pcap
            build_flags: --features pcap
            pcap: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: netscli.exe
            asset_name: netscli-windows-x86_64.exe
            build_flags: ""
            pcap: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: netscli.exe
            asset_name: netscli-windows-x86_64-pcap.exe
            build_flags: --features pcap
            pcap: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-x86_64
            build_flags: ""
            pcap: false
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-x86_64-pcap
            build_flags: --features pcap
            pcap: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-aarch64
            build_flags: ""
            pcap: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: netscli
            asset_name: netscli-macos-aarch64-pcap
            build_flags: --features pcap
            pcap: true
    steps:
      # On workflow_dispatch we need the tag ref explicitly. On release
      # events the default ref is already the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Install libpcap (Linux, pcap)
        if: runner.os == 'Linux' && matrix.pcap
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev pkg-config

      - name: Install musl toolchain (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update || true; sudo apt-get install -y musl-tools

      - name: Install Npcap SDK (Windows, pcap)
        if: runner.os == 'Windows' && matrix.pcap
        shell: pwsh
        run: |
          $sdkUrl = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          # Pinned digest for npcap-sdk-1.13.zip (364,431 bytes). npcap.com
          # is a third-party host outside our control, and whatever this
          # step unpacks gets linked into a binary we then cosign-sign — so
          # the signature would attest to a build that trusted an
          # unverified download. Verify before extracting.
          # Re-pin deliberately when bumping the SDK version.
          $sdkSha256 = "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd"
          $zipPath = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $destPath = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          if ($actual -ne $sdkSha256) {
            Write-Error "Npcap SDK checksum mismatch. Expected $sdkSha256, got $actual"
            exit 1
          }
          Write-Host "Npcap SDK checksum verified."
          Expand-Archive -Path $zipPath -DestinationPath $destPath -Force
          # The 1.13 zip has Lib/ and Include/ at the archive root, no
          # wrapping npcap-sdk/ folder. Point LIB/INCLUDE at $destPath
          # directly.
          $libPath = Join-Path $destPath "Lib\x64"
          $includePath = Join-Path $destPath "Include"
          "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$includePath;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build CLI
        run: cargo build --locked --release -p netscli --target ${{ matrix.target }} ${{ matrix.build_flags }}

      - name: Prepare release asset (rename)
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Generate SHA256 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
        working-directory: target/${{ matrix.target }}/release

      # Windows stops here and hands off to `sign-windows`.
      #
      # Everything below -- the digest, the sigstore signature, the release
      # upload -- has to happen AFTER Authenticode signing, because signing
      # rewrites the file. A digest taken here would describe bytes nobody
      # ever downloads. So the Windows legs upload the unsigned binary as a
      # workflow artifact instead, and `sign-windows` does the rest.
      #
      # It also means an unsigned .exe is never a release asset, not even
      # briefly: release.yml runs after the draft has been promoted, so
      # anything uploaded here is immediately public.
      - name: Hand the unsigned binary to the signing job
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          retention-days: 1
          if-no-files-found: error

      # Sigstore keyless signing via the GitHub Actions OIDC token. Produces
      # a .sig and .pem alongside each binary; verifiable by anyone with:
      #   cosign verify-blob --signature <asset>.sig --certificate <asset>.pem \
      #     --certificate-identity-regexp 'https://github.com/fstubner/netscli/.github/workflows/release\.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     <asset>
      - name: Install cosign
        if: runner.os != 'Windows'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned, not left to the action's default.
          #
          # The action version and the cosign version are different things,
          # and that gap is what broke the v0.3.1 release. Dependabot moved
          # this action from `@v3` to `@v4.1.2` in #166; the action's default
          # `cosign-release` moved with it, from v2.5.2 to v3.0.6. Nothing in
          # the diff mentioned cosign, and no release was cut between the
          # bump and v0.3.1, so the first time the new binary ever ran was
          # the release itself -- where all 15 matrix legs failed at signing.
          cosign-release: v3.0.6
      - name: Sign release asset (sigstore keyless)
        if: runner.os != 'Windows'
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd target/${{ matrix.target }}/release
          # Two flags, both load-bearing, and both defaulting to TRUE in
          # cosign v3.
          #
          # `--use-signing-config` is the one that actually broke v0.3.1.
          # With a signing config in play, cosign refuses to sign at all
          # unless a bundle is requested. From signcommon/common.go at
          # v3.0.6, lines 660-661:
          #
          #   if (useSigningConfig || signingConfigPath != "") &&
          #       !newBundleFormat && bundlePath == "" {
          #     return fmt.Errorf("must provide --new-bundle-format or
          #       --bundle ... with --signing-config or --use-signing-config")
          #
          # An earlier fix set only `--new-bundle-format=false`. That
          # satisfies one half of that condition and leaves the other
          # standing, so every leg that reached this step failed with
          # exactly the error above. Turning the signing config off is what
          # disarms the gate, and it is the only gate that applies: the
          # neighbouring checks at :649 and :656 both require a signing
          # config as well.
          #
          # `--new-bundle-format=false` is still needed on its own account.
          # With it true, cosign writes a bundle to --bundle -- unset here
          # -- instead of the detached files.
          #
          # With both off, sign_blob.go closes its `if ko.BundlePath != ""`
          # block (168-229) before the `outputSignature` (231) and
          # `outputCertificate` (250) writes, so the sidecars are produced.
          #
          # The sidecars are not incidental. `.sig` + `.pem` are what
          # packaging/README.md and the published install guide tell people
          # to pass to `cosign verify-blob`, and v0.2.6 shipped 64 assets as
          # .sha256/.sig/.pem triples. Moving to bundles is a real option,
          # but it rewrites those instructions and belongs in its own change.
          cosign sign-blob --yes \
            --use-signing-config=false \
            --new-bundle-format=false \
            --output-signature "${{ matrix.asset_name }}.sig" \
            --output-certificate "${{ matrix.asset_name }}.pem" \
            "${{ matrix.asset_name }}"

      - name: Upload Release Asset
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sha256
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sig
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.pem
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Desktop GUI installers ───────────────────────────────────────────
  # Builds the Tauri 2 desktop app on each native runner. .msi/.dmg/.deb/
  # .AppImage outputs from `tauri.conf.json:bundle.targets = "all"` get
  # renamed to `netscli-gui-{os}-{arch}.{ext}`, sigstore-signed, and
  # uploaded alongside the CLI binaries on the same release.
  #
  # GUI installers intentionally do not pass `--features pcap`: packet capture
  # requires libpcap/Npcap at runtime, and NetsCLI does not redistribute Npcap
  # inside the Windows desktop installer.
  #
  # macOS .dmg ships UNSIGNED — users see "unverified developer" on first
  # launch and must right-click → Open. Notarization (paid Apple Developer
  # cert) is tracked separately. Linux ARM64 + Windows ARM64 GUI builds
  # are out of matrix scope for v0.2.1 to keep CI budget reasonable.
  gui:
    name: Build GUI installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_prefix: netscli-gui-linux-x86_64
            bundle_dir: bundle
            bundle_globs: "deb/*.deb appimage/*.AppImage"
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_prefix: netscli-gui-macos-aarch64
            bundle_dir: bundle
            bundle_globs: "dmg/*.dmg"
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_prefix: netscli-gui-macos-x86_64
            bundle_dir: bundle
            bundle_globs: "dmg/*.dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_prefix: netscli-gui-windows-x86_64
            bundle_dir: bundle
            bundle_globs: "msi/*.msi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/netscli-gui/package-lock.json

      # Tauri 2 needs the same GTK/WebKit stack the lint job already
      # installs in ci.yml. Mirror it here so the bundle step can link.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          # `|| true` so a broken third-party apt index cannot fail this job;
          # the install below still fails hard. See the first occurrence in
          # ci.yml for the full reasoning.
          sudo apt-get update || true
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: npm ci
        run: npm ci
        working-directory: apps/netscli-gui

      # The trailing `-- --locked` is forwarded by the Tauri CLI to cargo, so
      # the Rust half of the installer gets the same lockfile enforcement the
      # CLI job above already has. Without it a signed .msi/.dmg could be
      # built against resolved-at-CI-time dependency versions that no
      # committed Cargo.lock ever pinned. `npm ci` covers the frontend half.
      - name: tauri build
        run: npm run tauri -- build --target ${{ matrix.target }} -- --locked
        working-directory: apps/netscli-gui

      # linuxdeploy bundles a copy of the wayland/xcb client stack and puts
      # it ahead of the host's on LD_LIBRARY_PATH, which aborts the app on
      # any host whose Mesa is newer than the runner's (#378). Nothing in
      # Tauri's bundler can switch that off, so the AppImage is corrected
      # here, before it is renamed, hashed or signed.
      #
      # Failing when the glob matches nothing is the point of the check
      # below. Without it a change to Tauri's output path would turn this
      # step into a no-op that still reports success, and the first sign of
      # it would be a bug report against a shipped release.
      - name: Unbundle host display libraries from the .AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(target/"${TARGET}"/release/bundle/appimage/*.AppImage)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::no .AppImage found to fix under target/${TARGET}/release/bundle/appimage/" >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            echo "--- ${image} ---"
            bash scripts/release/fix-appimage-host-libs.sh "${image}"
          done

      # Tauri puts bundles under apps/netscli-gui/src-tauri/target/<TARGET>/
      # release/bundle/{deb,appimage,dmg,msi}/. Rename each artifact to a
      # predictable name then sigstore-sign it.
      - name: Collect, rename, and sign GUI artifacts
        shell: bash
        env:
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
          BUNDLE_GLOBS: ${{ matrix.bundle_globs }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Cargo workspaces use the workspace-root `target/` regardless
          # of the cwd cargo was invoked from. Tauri puts its bundles in
          # target/<TARGET>/release/bundle/{deb,appimage,dmg,msi}/.
          BUNDLE_ROOT="target/${TARGET}/release/bundle"
          OUT_DIR="${RUNNER_TEMP}/gui-out"
          mkdir -p "${OUT_DIR}"
          # Walk each glob, copy with the canonical asset name preserving
          # the file extension. Tauri produces e.g. NetsCLI_0.2.1_amd64.deb;
          # we want netscli-gui-linux-x86_64.deb.
          for glob in ${BUNDLE_GLOBS}; do
            for src in ${BUNDLE_ROOT}/${glob}; do
              [ -e "${src}" ] || continue
              ext="${src##*.}"
              dst="${OUT_DIR}/${ASSET_PREFIX}.${ext}"
              cp "${src}" "${dst}"
              echo "Collected ${src} -> ${dst}"
            done
          done
          ls -la "${OUT_DIR}"

      # The Windows leg stops here, for the same reason the CLI job's does:
      # Authenticode signing rewrites the .msi, so a digest or a sigstore
      # signature taken now would describe bytes that never ship. The
      # `sign-windows` job picks this up and finishes it.
      - name: Hand the unsigned installer to the signing job
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.asset_prefix }}
          path: ${{ runner.temp }}/gui-out/${{ matrix.asset_prefix }}.*
          retention-days: 1
          if-no-files-found: error

      - name: Generate SHA256
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/gui-out"
          cd "${OUT_DIR}"
          for f in ${ASSET_PREFIX}.*; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "${f}.sha256"
            else
              shasum -a 256 "$f" > "${f}.sha256"
            fi
          done
          ls -la

      - name: Install cosign
        if: runner.os != 'Windows'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned for the same reason as the CLI job above: the action
          # version and the cosign version move independently, and the
          # action's default carried us from cosign v2.5.2 to v3.0.6 without
          # saying so. Keep both installers on the same pin.
          cosign-release: v3.0.6
      - name: Sign GUI artifacts (sigstore keyless)
        if: runner.os != 'Windows'
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/gui-out"
          cd "${OUT_DIR}"
          for f in ${ASSET_PREFIX}.*; do
            # Skip the sha256 + any pre-existing sig/pem on re-runs.
            case "$f" in
              *.sha256|*.sig|*.pem) continue ;;
            esac
            # Both flags for the same reasons as the CLI job above -- see
            # that step for the full explanation. Each defaults to true in
            # cosign v3: the signing config is what refuses to sign at all
            # without a bundle, and the bundle format is what would divert
            # output away from the --output-* files.
            #
            # The skip-list above stays keyed on .sig/.pem because that is
            # still what this produces. If this ever moves to bundles, that
            # list needs a .bundle arm or a re-run will sign its own output.
            cosign sign-blob --yes \
              --use-signing-config=false \
              --new-bundle-format=false \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Upload Release Asset
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ runner.temp }}/gui-out/${{ matrix.asset_prefix }}.*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Authenticode signing for the Windows artifacts ───────────────────
  # Every Windows artifact is signed here, and nowhere else. The two matrix
  # jobs above hand their Windows outputs over as workflow artifacts and do
  # nothing further with them, so this job is the only path by which a .exe
  # or .msi becomes a release asset.
  #
  # That is deliberate rather than tidy. Signing rewrites the file, so the
  # digest, the sigstore signature and the upload all have to come after it
  # — and a release that carried some signed artifacts and some unsigned
  # ones would be worse than one that carried none, because nothing would
  # say which was which.
  #
  # It runs on Linux despite signing Windows binaries. The key is a Certum
  # cloud certificate reached over HTTPS, not a file `signtool` could load,
  # so the runner's OS stops mattering. See scripts/release/sign-windows.sh.
  #
  # `environment: release-signing` scopes the credentials to this job. The
  # environment deliberately carries no protection rules: a required
  # reviewer or a branch policy here would stall every release at the point
  # where the artifacts are half uploaded. It exists to hold the secrets,
  # not to gate anything.
  sign-windows:
    name: Sign Windows artifacts
    needs: [release, gui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    steps:
      # The default branch, NOT the tag, and for the same reason
      # publish-release.yml checks out the default branch: the only thing
      # this checkout provides is the signing script, which is release
      # tooling rather than part of what is being released. The artifacts
      # come from the two build jobs, already compiled from the tag.
      #
      # Checking out the tag makes a fix to the script unreachable by the
      # release that needs it. v0.3.3 hit exactly that: the verification
      # step had a bug, the fix merged to main minutes later, and re-running
      # the job would still have run the broken copy frozen at the tag. The
      # only ways out would have been moving a published tag or shipping
      # without Windows binaries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      # libengine-pkcs11-openssl is not optional and not obvious.
      # osslsigncode's `-pkcs11module` does not load the module directly --
      # it goes through OpenSSL's pkcs11 engine, which ships in that
      # separate package and is not installed on ubuntu-latest. Without it
      # the MSI step fails at `Failed to find and load 'pkcs11' engine`,
      # having never reached Certum, and the message names the engine rather
      # than the missing package. Reproduced in an ubuntu:24.04 container;
      # with the package present the same command reports `Engine "pkcs11"
      # set.` and gets as far as authentication.
      - name: Install osslsigncode and the pkcs11 engine
        run: |
          sudo apt-get update || true
          sudo apt-get install -y osslsigncode libengine-pkcs11-openssl

      # `merge-multiple` flattens the three `unsigned-*` artifacts into one
      # directory, which is what the signing script takes.
      - name: Collect the unsigned Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: unsigned-*
          path: ${{ runner.temp }}/win
          merge-multiple: true

      # Fails when nothing arrived. Without this the signing script would
      # also fail, but one job up: a matrix leg that died leaves this job
      # with an empty directory, and "signed 0 files" must never read as
      # success.
      - name: Check what arrived
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/win"
          ls -la
          count=$(find . -maxdepth 1 \( -name '*.exe' -o -name '*.msi' \) | wc -l)
          if [[ "$count" -ne 3 ]]; then
            echo "::error::expected 3 Windows artifacts (2 .exe + 1 .msi), found ${count}"
            exit 1
          fi

      - name: Authenticode sign
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: bash scripts/release/sign-windows.sh "${RUNNER_TEMP}/win"

      # From here on it is the same tail the other matrix legs run, against
      # the signed bytes.
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/win"
          for f in *.exe *.msi; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
          done
          cat ./*.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as the two jobs above; see the CLI job for why the
          # action version and the cosign version are pinned separately.
          cosign-release: v3.0.6

      - name: Sign with sigstore
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/win"
          for f in *.exe *.msi; do
            [ -f "$f" ] || continue
            # Both flags for the reasons spelled out in the CLI job's
            # signing step: each defaults to true in cosign v3, and between
            # them they would refuse to sign at all and then divert the
            # output away from the sidecars.
            cosign sign-blob --yes \
              --use-signing-config=false \
              --new-bundle-format=false \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ runner.temp }}/win/*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
