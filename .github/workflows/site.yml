name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintainability:
    name: File size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-file-size.mjs

  build:
    name: Build + typecheck
    needs: maintainability
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Accessibility check
        # site/ is currently reverted to a pre-redesign state that predates
        # this script; skip rather than fail once until the redesign (and
        # its a11y tooling) ships deliberately.
        run: npm run test:a11y --if-present
