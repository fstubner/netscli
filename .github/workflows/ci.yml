name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# This workflow runs on pull_request and executes dependency install scripts;
# it must never hold a writable token.
permissions:
  contents: read

jobs:
  # Everything whose behaviour depends on the host OS: path handling and
  # store-directory encoding (Claude Code encodes a POSIX root with a leading
  # separator and a Windows one with a drive letter), the better-sqlite3
  # native build, and the CLI entry point. Running only on Linux previously
  # let a bug ship that made every macOS and Linux project scrape zero
  # sessions, because the fixtures and the developer's machine are Windows.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      # Every job here loads the real embedding model, so each one pulls the
      # 86MB MiniLM from HuggingFace: four jobs a run, and HuggingFace starts
      # answering 429. That blocked a merge on 2026-08-28 with nothing wrong
      # in the code. (The default briefly moved to the larger mpnet and was
      # moved back on 2026-08-30; the cache is worth keeping either way.)
      #
      # transformers.js caches inside its own package directory and honours no
      # override for it, so this has to run *after* `npm ci` — which deletes
      # node_modules, and the cache with it.
      #
      # Keyed on embeddings.ts because that is where the model and its weight
      # precision are named: change either and the key changes, so a stale
      # model can never be served to a new configuration. Editing that file
      # for anything else costs one download.
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-model-${{ runner.os }}-${{ hashFiles('src/handoff/embeddings.ts') }}

      - name: Unit and integration tests
        run: |
          npm test
          npm run test:integration

      - name: Drift canary
        run: npm run test:drift

      # Seeds every tool's native store at the path the product computes for
      # this platform, so a scraper that silently matches nothing on macOS or
      # Windows fails here instead of in someone's install.
      - name: Cross-tool pickup smoke
        run: npm run test:smoke

      - name: Build package
        run: npm run build

      - name: CLI smoke check
        run: npm run smoke:cli

      - name: Public demo smoke
        run: npm run demo:public

  # OS-independent gates: linting, security, dependency audits, the landing
  # site, and packaging. Running these once keeps the matrix cheap.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json
            cloud/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Install cloud dependencies
        run: npm --prefix cloud ci

      # Every job here loads the real embedding model, so each one pulls the
      # 86MB MiniLM from HuggingFace: four jobs a run, and HuggingFace starts
      # answering 429. That blocked a merge on 2026-08-28 with nothing wrong
      # in the code. (The default briefly moved to the larger mpnet and was
      # moved back on 2026-08-30; the cache is worth keeping either way.)
      #
      # transformers.js caches inside its own package directory and honours no
      # override for it, so this has to run *after* `npm ci` — which deletes
      # node_modules, and the cache with it.
      #
      # Keyed on embeddings.ts because that is where the model and its weight
      # precision are named: change either and the key changes, so a stale
      # model can never be served to a new configuration. Editing that file
      # for anything else costs one download.
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-model-${{ runner.os }}-${{ hashFiles('src/handoff/embeddings.ts') }}

      - name: Lint
        run: npm run lint

      - name: Typecheck (including the test tree)
        run: npm run typecheck

      - name: Cloud Worker typecheck and tests
        run: npm run test:cloud

      - name: Root security tests and checklist
        run: |
          npm run test:security
          npm run security:checklist
          npm run audit:production

      # Both used to run only inside `verify:release`, which only the release
      # workflow invokes — so a broken workflow file or an unmapped file was
      # found at release time, if at all. An invalid release.yml sat on a
      # branch for two days with this job green.
      - name: Workflow files and review coverage
        run: |
          npm run check:workflows
          npm run check:review-coverage

      - name: Landing dependency audit
        # The landing site has only devDependencies (Astro is a build-time
        # dependency of a static site), so --omit=dev would audit nothing.
        run: npm run audit:landing

      # Ranking quality gate. Single platform on purpose: the baseline is
      # derived from float embeddings, so its portability across runners is
      # unproven — running it in one place keeps the signal honest until that
      # is established.
      - name: Retrieval ranking eval
        run: npm run test:eval

      - name: Build landing
        run: npm --prefix landing run build

      - name: Package dry run
        run: npm pack --dry-run

  # Aggregate gate. Branch protection on `main` requires a check named
  # `test-and-build`, so that name has to keep reporting — splitting the old
  # single job into `test` + `checks` silently removed it and would have
  # blocked every future pull request, not just the one that made the change.
  # Depending on the matrix here also makes each platform effectively
  # required, without editing repository settings to do it.
  test-and-build:
    if: always()
    needs: [test, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "test=${{ needs.test.result }} checks=${{ needs.checks.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.checks.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed." >&2
            exit 1
          fi
