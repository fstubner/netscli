name: Deploy GitHub Pages

# Builds the Astro site in `site/` and deploys the static output to
# GitHub Pages.
#
# The push trigger was removed while site/ held a redesign that was still
# mid review, because auto-deploying on every main merge had shipped that
# redesign to netscli.com once before it was ready. The redesign shipped on
# 2026-09-13, so the condition is gone and deploys are automatic again.
# `workflow_dispatch` stays alongside it, for redeploying without a commit.
#
# The `paths:` list below is copied from site.yml rather than written as
# `['site/**']`, because the build reads four files from outside site/:
# CHANGELOG.md (changelog.astro imports it with ?raw), scripts/install.ps1
# and scripts/install.sh (served at /install.ps1 and /install.sh), and
# apps/netscli-gui/package.json (site-content/version.ts reads the version
# from it). A site/**-only filter would leave changes to those four built
# but never deployed -- the site would render a stale changelog or version
# with nothing failing to say so.
#
# That makes this the same list in four places: here, site.yml's push
# filter, site.yml's `changes` job grep, and site-preview.yml's two
# filters. Keep them in step; YAML has no variable to share them.
#
# Prerequisite: in the repo Settings → Pages, set "Source" to
# "GitHub Actions" (NOT "Deploy from a branch"). This workflow expects
# that mode.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - 'scripts/install.ps1'
      - 'scripts/install.sh'
      - 'apps/netscli-gui/package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; if a newer push comes in while we're
# mid-deploy, queue it and skip the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Astro 6 requires Node >=22.12. Pinning to 22 (active LTS).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: site
      - name: astro build
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site/dist/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
