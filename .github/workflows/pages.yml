name: Deploy GitHub Pages

# Builds the Astro site in `site/` and deploys the static output to
# GitHub Pages on every push to main. Also re-runs on manual trigger
# (e.g. after updating analytics config).
#
# Prerequisite: in the repo Settings → Pages, set "Source" to
# "GitHub Actions" (NOT "Deploy from a branch"). This workflow expects
# that mode.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; if a newer push comes in while we're
# mid-deploy, queue it and skip the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Astro 6 requires Node >=22.12. Pinning to 22 (active LTS).
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: site
      - name: astro build
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - name: Upload site/dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
