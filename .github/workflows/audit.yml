name: Audit

on:
  # Weekly catch for advisories we've already shipped against.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  # Re-run when deps change or the audit config itself changes.
  #
  # Restricted to main. Unfiltered, a Dependabot PR touching Cargo.lock fired
  # this twice for one commit — once for the branch push, once for the PR —
  # and the concurrency group below keys on `github.ref`, which differs
  # between those two refs, so the duplicate did not even cancel itself.
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
  # Let us kick it off manually from the Actions tab.
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        # See ci.yml's lint job for why this pin keeps a `# stable` comment
        # rather than a version number.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit

      # Cache cargo-audit itself so we don't reinstall every run.
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-v1

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
