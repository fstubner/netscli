name: GUI Render

# Schedule and manual only — deliberately NOT on pull_request.
#
# The suite now drives the app by *attaching* to it rather than letting
# msedgedriver launch it. See e2e/tauri-render/driver.mjs for the full
# reasoning; briefly: msedgedriver reads the debug port back out of a
# `DevToolsActivePort` file in the temporary user-data-dir it created, and
# wry writes that file into Tauri's own WebView2 profile instead, so the
# driver looked in a directory that never had it.
#
# That fix is proven on an ordinary non-elevated Windows machine, where the
# suite now attaches and drives the app through real scenarios.
#
# It does NOT make this workflow pass, and the reason is the other half of
# the original note, which was right: on a hosted runner the app never opens
# the debug port at all. A dispatch on 2026-08-20 failed with "Timed out
# waiting for port" after a clean build, with WebView2 and Edge both at
# 151.0.4129.72, so this is not the version mismatch it can look like.
#
# So there were two problems stacked on each other. The port-file location
# is fixed. WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS being ignored -- which
# Microsoft documents as intended on an elevated host, and hosted Windows
# runners are elevated -- is not, and cannot be from our side.
#
# The step below now reports elevation, so the next run measures that rather
# than inferring it. Until it changes, the value of this suite is local and
# on any non-elevated Windows host, where it does run.
#
# Run per-PR it cost ~13 minutes on every PR touching the GUI or core — nine
# of the last ten runs failed, all at the same step, for that same reason.
# A check that cannot pass teaches everyone to ignore a red X, which is worse
# than not running it: the next genuine failure looks identical to the noise.
#
# The weekly run is what tells us the day upstream fixes it, and
# workflow_dispatch covers investigating it on demand. No coverage is lost by
# dropping the PR trigger, because there was no passing signal to lose.
#
# To restore per-PR runs: confirm a green scheduled run first, then re-add
#
#   pull_request:
#     branches: [main]
#     paths:
#       - 'apps/netscli-gui/**'
#       - 'crates/netscli-core/**'
#       - 'Cargo.lock'
#       - 'Cargo.toml'
#       - 'rust-toolchain.toml'
#       - '.github/workflows/gui-render.yml'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 2'  # Tuesdays 07:00 UTC

concurrency:
  group: gui-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tauri-render:
    name: Tauri render automation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # See ci.yml's lint job for why this pin keeps a `# stable` comment
        # rather than a version number.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gui-render-windows

      - uses: actions/setup-node@v7
        with:
          # 22, matching ci.yml and the release build. See ci.yml's note.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/netscli-gui/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: apps/netscli-gui

      - name: Diagnose WebView2 / driver environment
        shell: pwsh
        continue-on-error: true
        run: |
          function Get-Pv($id, $label) {
            foreach ($root in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients',
                                'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients',
                                'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients')) {
              $key = Join-Path $root $id
              if (Test-Path $key) {
                $pv = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
                if ($pv) { Write-Host "${label}: $pv   [$root]"; return }
              }
            }
            Write-Host "${label}: NOT FOUND"
          }
          # These GUIDs are Microsoft's stable product ids for the two
          # separately-versioned components. A Tauri app renders in the
          # WebView2 Runtime, but the `edgedriver` npm package version-
          # matches against the Edge *browser* — if these differ, that is
          # the bug.
          Get-Pv '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' 'WebView2 Runtime'
          Get-Pv '{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}' 'Edge (stable) '

          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (Test-Path $edge) {
            Write-Host "msedge.exe      : $((Get-Item $edge).VersionInfo.ProductVersion)"
          } else { Write-Host "msedge.exe      : NOT FOUND" }

          Write-Host "session type    : $([Environment]::UserInteractive)"
          # Elevation is the documented reason WebView2 ignores
          # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, and it is the remaining
          # blocker here -- so measure it rather than assume it.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "user            : $($identity.Name)"
          Write-Host "elevated        : $elevated"

      - name: Run Tauri render test
        run: npm run test:tauri-render
        working-directory: apps/netscli-gui

      # Talk to msedgedriver directly with --verbose, bypassing
      # tauri-driver. tauri-driver relays none of the native driver's
      # output, so this is the only way to see why the debug port never
      # appears.
      - name: msedgedriver verbose session probe (on failure)
        if: failure()
        continue-on-error: true
        run: node e2e/tauri-render/diagnose-driver.mjs
        working-directory: apps/netscli-gui

      # On failure, show what the app itself did. msedgedriver's error
      # cannot distinguish "app crashed" from "driver could not attach",
      # and those need completely different fixes.
      - name: Probe the built app directly (on failure)
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $app = Get-ChildItem -Path target\debug\netscli-gui.exe -ErrorAction SilentlyContinue
          if (-not $app) {
            Write-Host "app binary not found under target\debug"
            Get-ChildItem -Recurse -Filter netscli-gui.exe -Depth 4 -ErrorAction SilentlyContinue |
              Select-Object -First 5 FullName
            exit 0
          }
          Write-Host "app: $($app.FullName)  size=$($app.Length)"
          $p = Start-Process -FilePath $app.FullName -PassThru `
                 -RedirectStandardError app-stderr.txt -RedirectStandardOutput app-stdout.txt
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "app EXITED early with code $($p.ExitCode)"
          } else {
            Write-Host "app is still running after 12s (so it launches fine)"
            Stop-Process -Id $p.Id -Force
          }
          foreach ($f in 'app-stdout.txt','app-stderr.txt') {
            if ((Test-Path $f) -and (Get-Item $f).Length -gt 0) {
              Write-Host "--- $f ---"; Get-Content $f -Tail 40
            }
          }
