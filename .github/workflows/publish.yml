name: publish

# Publishing to npm. Dispatched against a release tag: by `release.yml` right
# after it cuts one, or by hand for a version tagged earlier.
#
# Kept separate from cutting a release so an already-tagged version can be
# published later — which is not hypothetical: this repo sat fifteen versions
# tagged-but-unpublished, and recovering from that needs a publish that does
# not also cut something new.
#
# Always its own run, never called as a reusable workflow. npm trusted
# publishing checks the workflow that STARTED the run, and every publish that
# ever succeeded ran as this file. Called from `release.yml` the identity npm
# saw would be `release.yml`, which is not the trusted publisher, so the
# publish half of a release would fail after the tag was already pushed:
# another tagged-but-unpublished version. That path never ran once.
#
# Do not add a `release: published` trigger. It had one once, with releases
# marked as drafts so nothing published itself, and that broke the release
# process outright: GitHub's `releases/latest` endpoint hides drafts, the
# release tooling read that endpoint to find the last release, so it saw the
# last pre-draft version forever and proposed a release covering the entire
# history. It cut 76 versions over four days before anyone noticed. Releases
# are published rather than drafted for that reason, and the gate is that
# someone, or the release workflow they started, runs this.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to publish package.json version from this ref via OIDC"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Never run two publishes concurrently; never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-npm:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    outputs:
      # The smoke job has no checkout, so the version it verifies has to come
      # from here. It used to come from the release tag, which no longer
      # exists as a trigger input.
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag check below needs tags; the default shallow clone has none.
          # The dispatched ref -- the release tag -- is what gets checked out.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json
            cloud/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      # verify:release runs test:cloud, which typechecks the Worker against
      # its own dependencies. Without this the release run failed at
      # "Cannot find type definition file for '@cloudflare/workers-types'".
      - name: Install cloud dependencies
        run: npm --prefix cloud ci

      - name: Print package identity
        id: identity
        run: |
          version=$(node -p 'require("./package.json").version')
          name=$(node -p 'require("./package.json").name')
          echo "Publishing ${name}@${version} from ${GITHUB_REF}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # What gets published is package.json at whatever ref was dispatched, so
      # the version has to correspond to a real release rather than to a
      # branch tip someone happened to pick.
      - name: Verify this commit is tagged for the version being published
        run: |
          version=$(node -p 'require("./package.json").version')
          git fetch --tags --quiet
          if ! git tag --points-at HEAD | grep -qx "xtctx-v${version}\|v${version}"; then
            echo "No tag xtctx-v${version} at this commit. Dispatch this workflow against a release tag." >&2
            git tag --points-at HEAD | sed 's/^/  found: /' >&2
            exit 1
          fi

      - name: Verify release
        run: npm run verify:release

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public

  # A deploy is not done until its health is observed: install the published
  # version from the registry and smoke it. Failure here pages via the
  # workflow failure notification and is the trigger to follow RELEASE.md's
  # rollback section.
  post-publish-smoke:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Deliberately no checkout. `npx xtctx` inside the repo resolves the
      # *local* package — package.json declares the `xtctx` bin as
      # dist/src/cli/index.js, which is unbuilt here — so the smoke reported
      # `sh: 1: xtctx: not found` while the published package was perfectly
      # fine. Worse than the false alarm: with a built dist present it would
      # have exercised the working tree and passed without ever touching the
      # registry, which is the one thing this job exists to check.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Smoke the published package from the registry
        working-directory: ${{ runner.temp }}
        env:
          # Passed from the publish job rather than read from the repo, so this
          # job can keep its deliberate lack of a checkout.
          PUBLISHED_VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          version="$PUBLISHED_VERSION"
          if [ -z "$version" ]; then
            echo "Publish job did not report a version." >&2
            exit 1
          fi

          echo "Waiting for xtctx@${version} to be visible on the registry..."
          for attempt in 1 2 3 4 5 6; do
            if npm view "xtctx@${version}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "xtctx@${version} never became visible on the registry." >&2
              exit 1
            fi
            sleep 20
          done

          npx -y "xtctx@${version}" --help
          installed=$(npx -y "xtctx@${version}" --version)
          echo "installed version: ${installed}"
          if [ "$installed" != "$version" ]; then
            echo "Published package reports '${installed}', expected '${version}'." >&2
            exit 1
          fi
