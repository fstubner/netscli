<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="netscli">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#005a1e"/>
      <stop offset="45%" stop-color="#0aae7a"/>
      <stop offset="100%" stop-color="#1edcff"/>
    </linearGradient>
    <style>
      .n {
        font-family: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 9px;
        font-weight: 400;
      }
    </style>
  </defs>

  <rect width="64" height="64" rx="10" ry="10" fill="#111"/>

  <!-- The "N" block from the ANSI Shadow wordmark, 10 chars wide x 6 rows
       tall. Same font stack and gradient as docs/assets/netscli-wordmark.svg
       so the favicon reads as a zoomed-in slice of the header logo. -->
  <g fill="url(#g)" class="n" text-anchor="middle">
    <text x="32" y="14" xml:space="preserve">███╗   ██╗</text>
    <text x="32" y="23" xml:space="preserve">████╗  ██║</text>
    <text x="32" y="32" xml:space="preserve">██╔██╗ ██║</text>
    <text x="32" y="41" xml:space="preserve">██║╚██╗██║</text>
    <text x="32" y="50" xml:space="preserve">██║ ╚████║</text>
    <text x="32" y="59" xml:space="preserve">╚═╝  ╚═══╝</text>
  </g>
</svg>
